<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Survey App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Inter,system-ui,Arial;margin:24px;background:#f5f7fb}
    .card{max-width:640px;margin:20px auto;padding:18px;border-radius:10px;background:#fff;box-shadow:0 6px 24px rgba(16,24,40,0.06)}
    label{display:block;margin-bottom:8px;font-weight:600}
    input,select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #e6e9ef;margin-bottom:12px}
    button{padding:10px 14px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-weight:700}
    .success{background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46;padding:10px;border-radius:8px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Survey</h1>
    <form id="survey-form">
      <label>Name
        <input name="name" required>
      </label>
      <label>Age
        <input name="age" type="number" required>
      </label>
      <label>Sex
        <select name="sex" required>
          <option value="">Select</option>
          <option>Female</option>
          <option>Male</option>
          <option>Other</option>
        </select>
      </label>
      <label>Location
        <input name="location" required>
      </label>
      <label>Native language
        <input name="native_language" required>
      </label>
      <button type="submit">Submit</button>
    </form>
    <div id="result" style="margin-top:12px"></div>
  </main>

  <script>
    const form = document.getElementById('survey-form');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      // coerce age
      data.age = Number(data.age);
      try {
        const res = await fetch('/api/surveys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('Network response was not ok');
        const json = await res.json();
        result.innerHTML = `<div class="success">Thanks — saved with id ${json.id}.</div>`;
        form.reset();
      } catch (err) {
        result.textContent = 'Error submitting survey: ' + err.message;
      }
    });
  </script>
</body>
</html>
